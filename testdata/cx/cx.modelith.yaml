# yaml-language-server: $schema=https://modelith.sh/schema/domain-model/v1.json
#
# The cx fixture's domain model: one case of each conformance rule that the
# fixture's types can show, and of each invariant check.
kind: DomainModel
version: v1
enums:
  Level:
    values: # Top has no constant: domain-enum-drift
      - name: Low
      - name: Mid
      - name: High
      - name: Top
  Currency: # no type: domain-enum-missing
    values:
      - name: usd
entities:
  Role:
    definition: What a user may do.
  Invoice:
    definition: A bill to a `Role`.
    invariants: # Total enforces it, and its exported fields expose it: invariant-exposed
      - id: positive-amount
        statement: "An `Invoice` amount is never negative."
    relationships: # Invoice.Role refers to it: conforms
      - entity: Role
        cardinality: "n:1"
  Credentials: # plays the contract role: domain-contract-entity
    definition: How a user proves who they are.
    relationships: # neither type refers to the other: domain-relationship-missing
      - entity: Role
        cardinality: "n:1"
  Session: # no type: domain-entity-missing
    definition: A signed-in user's visit.
    invariants: # nothing enforces it: invariant-unenforced
      - id: one-session-per-user
        statement: "A user has at most one open `Session`."
  Ledger: # mapped to a type that does not exist: domain-type-unmapped
    definition: Where invoices are recorded.
  Receipt: # billing and audit each declare one: domain-entity-ambiguous
    definition: Proof that an invoice was paid.
invariants: # a test enforces it, and Role has no fields to expose
  - id: admin-approves
    statement: "Only an admin `Role` approves an `Invoice`."
